# Ruff configuration for the Jarvis project (Batch 11).
#
# The rule set is curated on purpose. It catches correctness and hygiene
# problems (unused imports, blind asserts, needless `int()` casts,
# redundant `return None`, un-sorted imports, ...) without rewriting the
# project's established style. Style-only rules that would touch a lot of
# already-reviewed code, and rules that fight deliberate design choices,
# are left out or ignored with a reason below. Ruff is a development
# dependency only (see `requirements-dev.txt`); it is not needed at run
# time.

[tool.ruff]
target-version = "py312"
# Ruff's default column limit. Hand-written code in this project aims for
# 79 columns, but the existing sources already contain a handful of longer
# lines, so the automated gate uses Ruff's default to avoid mass
# re-wrapping of reviewed code.
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting (isort)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
]
ignore = [
    # Guard-clause chains (`if bad: return False` ... `return True`) are
    # intentional and read more clearly in the security-sensitive
    # confirmation/policy code than a single collapsed condition.
    "SIM102",
    "SIM103",
    # Combining `with` contexts is a matter of taste; merging them here
    # would churn reviewed tests for no behavioural gain.
    "SIM117",
]
